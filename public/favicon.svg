<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Left Cyan to Blue Gradient -->
    <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    
    <!-- Right Cyan to Emerald Green Gradient -->
    <linearGradient id="vGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Full V Gradient -->
    <linearGradient id="vFullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B2FE" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background container for icon -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF" />
  
  <!-- Outer Double V Mark -->
  <g transform="translate(64, 56) scale(0.75)">
    <!-- Left outer line -->
    <path
      d="M 120 70 L 256 390 L 290 390 L 160 70 Z"
      fill="url(#vGradLeft)"
    />
    <!-- Inner V line -->
    <path
      d="M 175 70 L 256 325 L 337 70 L 375 70 L 256 375 L 137 70 Z"
      fill="url(#vFullGrad)"
    />
    <!-- Right outer line -->
    <path
      d="M 352 70 L 256 390 L 290 390 L 392 70 Z"
      fill="url(#vGradRight)"
    />
  </g>
</svg>
